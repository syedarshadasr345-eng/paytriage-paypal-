[pytest]
addopts = -ra -rs
markers =
    live_ai: Opt-in live tests that interact with external Gemini API (requires RUN_LIVE_AI=1).
    live_paypal: Opt-in live tests that interact with PayPal Sandbox API (requires RUN_LIVE_PAYPAL=1).
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient
